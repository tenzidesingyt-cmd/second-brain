name: Reminder sweep

on:
  schedule:
    # GitHub Actions is best-effort: runs can be delayed by a few minutes.
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: reminder-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request GitHub OIDC token
        env:
          AUDIENCE: second-brain-reminders
        run: |
          set -euo pipefail
          response=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}")
          token=$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          echo "::add-mask::${token}"
          printf 'OIDC_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"

      - name: Wake server and deliver due reminders
        env:
          APP_URL: https://second-brain-production-e19a.up.railway.app
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            status=$(curl -sS -o /tmp/reminders.json -w '%{http_code}' --max-time 90 \
              -X POST \
              -H "Authorization: Bearer ${OIDC_TOKEN}" \
              "${APP_URL}/api/internal/reminders/run" || true)
            if [ "$status" = "200" ]; then
              cat /tmp/reminders.json
              exit 0
            fi
            echo "Attempt ${attempt}: HTTP ${status:-no response}"
            sleep 10
          done
          cat /tmp/reminders.json 2>/dev/null || true
          exit 1
